name: Parking
options:
  bundleIdPrefix: com.vncdc.parking
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 6 language mode: the stretch beyond 6.1's Default, taken because it
    # measured free — the project built and tested clean under it with no source
    # changes. Data-race safety is then a language rule rather than a build setting
    # somebody could switch off. See ADR-001.
    SWIFT_VERSION: "6.0"
    # 6.1 Default column: zero build warnings, -strict-concurrency=complete clean,
    # SPM only. Implemented as written rather than swapped.
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # The compiler extracts every localisable literal at build time, so the String Catalog
    # is fed from the code rather than maintained by hand (Day 7, "no hardcoded strings").
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Build number derives from the commit count in CI, never hand-edited (6.4).
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"

targets:
  Parking:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Parking
        # From the build settings, not literals. XcodeGen wrote "1" and "1.0" here, so every
        # archive shipped as 1.0 (1) and the commit-count build number make archive passes
        # never reached the app. Found by make ipa printing the version.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Required because this target supplies its own Info.plist, so nothing synthesises
        # a scene manifest. Without it the app is not scene-based: the window never resizes,
        # so rotating the device leaves a portrait-shaped app letterboxed on a landscape
        # screen, and iPad multitasking does not work either.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Face ID re-authentication before anything that moves money: a reservation or a
        # deposit (6.5, ADR-006). Translated in Sources/Resources/InfoPlist.xcstrings.
        NSFaceIDUsageDescription: "Confirms it is you before money moves: reserving a space or adding funds."
        # The local backend is plaintext HTTP. Scoped to localhost, and to the local network
        # for running on a device against the development Mac (`.local` names). Documented in
        # docs/security.md as a local-development bypass; release builds refuse plaintext in
        # HTTPClient whatever ATS allows.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        # iOS asks before an app talks to devices on the local network. Only a development
        # build pointed at the Mac ever does. Translated in InfoPlist.xcstrings.
        NSLocalNetworkUsageDescription: "Connects to the development server on this network."
        # Debug builds read these when the scheme's environment does not set them: a device
        # build opened from the home screen has no scheme. From Config/*.xcconfig.
        PARKING_BASE_URL: $(PARKING_BASE_URL)
        PARKING_WINDOW_HOUR: $(PARKING_WINDOW_HOUR)
        PARKING_SPKI_PINS: $(PARKING_SPKI_PINS)
    configFiles:
      Debug: Config/Parking.xcconfig
      Release: Config/Parking.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vncdc.parking
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  ParkingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: Parking
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vncdc.parking.tests
        GENERATE_INFOPLIST_FILE: YES

  ParkingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: Parking
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vncdc.parking.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Parking:
    build:
      targets:
        Parking: all
        ParkingTests: [test]
        ParkingUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - ParkingTests
        - ParkingUITests
    run:
      config: Debug
